<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Meo3 Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <span class="header-title">🎬 Meo3</span>
  <div id="tokenStatus" class="status-dot">Đang kết nối...</div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="drama">✨ Kịch Bản & Ghép</button>
  <button class="tab-btn" data-tab="video">📹 Video</button>
  <button class="tab-btn" data-tab="image">🖼️ Ảnh</button>
  <button class="tab-btn" data-tab="list">📋 Danh sách</button>
</div>

<!-- TAB DRAMA STUDIO (KỊCH BẢN AI & GHÉP VIDEO) -->
<div id="tab-drama" class="tab-content hidden">
  <div class="drama-header">
    <div style="font-weight:700; font-size:13px; color:#1e293b;">🧠 Gemini Script Studio & Ghép Video</div>
    <div style="font-size:11px; color:#64748b;">Tạo kịch bản, audio script & gen video nối cảnh tự động</div>
  </div>

  <!-- BƯỚC 1: NHẬP CHỦ ĐỀ VÀ TẠO KỊCH BẢN -->
  <div class="drama-card">
    <label class="label">1. Chủ đề / Ý tưởng video (VD: Trước tuổi 35, Bài học kinh doanh...)</label>
    <textarea id="dramaTopic" rows="2" placeholder="Nhập chủ đề hoặc dán nội dung thô cần làm video..." class="input">Nếu bạn hiểu điều này trước tuổi 35, cuộc đời bạn sẽ rất khác</textarea>
    
    <div class="row2" style="margin-top:6px;">
      <div>
        <label class="label">Số phân cảnh</label>
        <select id="dramaSceneCount" class="select">
          <option value="3">3 Cảnh (~15 giây)</option>
          <option value="5" selected>5 Cảnh (~25-30 giây)</option>
          <option value="8">8 Cảnh (~45-50 giây)</option>
          <option value="10">10 Cảnh (~1 phút)</option>
        </select>
      </div>
      <div>
        <label class="label">Phong cách Visual</label>
        <select id="dramaVisualTone" class="select">
          <option value="Cinematic Dark Moody 8K">Điện ảnh sâu lắng (Dark Moody)</option>
          <option value="Cyberpunk Neon Future">Cyberpunk Viễn tưởng</option>
          <option value="Anime Makoto Shinkai">Anime cảm xúc lung linh</option>
          <option value="Minimalist Motion Flat">Vector Minimalist</option>
        </select>
      </div>
    </div>

    <button id="btnGenDramaScript" class="btn btn-blue" style="margin-top:8px;">✨ Dùng Gemini Tạo Kịch Bản & Prompts</button>
    <div id="dramaGenStatus" class="status-msg hidden"></div>
  </div>

  <!-- BƯỚC 2: QUẢN LÝ VOICE SCRIPT & COPY AUDIO -->
  <div id="dramaScriptBox" class="drama-card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <label class="label" style="margin:0; font-weight:700;">2. Script Thuyết Minh (Đọc lồng tiếng)</label>
      <button id="btnCopyFullScript" class="btn-link" style="font-weight:700; color:#2563eb;">📋 Copy Toàn Bộ Script</button>
    </div>
    <textarea id="dramaFullVoiceScript" rows="4" class="input" style="background:#f8fafc; font-size:12px; line-height:1.4;" placeholder="Lời thoại thuyết minh sẽ hiện ở đây..."></textarea>
    <div style="font-size:11px; color:#64748b; margin-top:4px;">👉 Copy script này dán sang <b>ElevenLabs / Vbee / CapCut AI Voice</b> để xuất file âm thanh.</div>
  </div>

  <!-- BƯỚC 3: DANH SÁCH CÁC PHÂN CẢNH (SCENES) -->
  <div id="dramaScenesBox" class="drama-card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <label class="label" style="margin:0; font-weight:700;">3. Phân Cảnh & Video Prompt</label>
      <span id="dramaSceneBadge" style="font-size:11px; background:#e0e7ff; color:#3730a3; padding:2px 6px; border-radius:4px; font-weight:600;">5 Scenes</span>
    </div>
    <div id="dramaScenesList" style="display:flex; flex-direction:column; gap:8px;"></div>

    <div style="margin-top:12px; display:flex; flex-direction:column; gap:6px;">
      <button id="btnGenAllDramaVideos" class="btn btn-purple" style="font-size:13px; font-weight:700; padding:10px;">🚀 Bắt Đầu Tự Động Gen Toàn Bộ Scenes</button>
      <button id="btnMergeDramaVideos" class="btn btn-blue hidden" style="font-size:13px; font-weight:700; padding:10px; background:#059669;">🎬 Tải & Ghép Video Hoàn Chỉnh (.mp4)</button>
    </div>
    <div id="dramaMergeStatus" class="status-msg hidden"></div>
  </div>
</div>


<!-- TAB VIDEO -->
<div id="tab-video" class="tab-content">
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="single" data-group="video">Đơn lẻ</button>
    <button class="mode-btn" data-mode="batch" data-group="video">Batch</button>
  </div>

  <div id="videoSingle">
    <label class="label">Prompt</label>
    <textarea id="videoPrompt" rows="3" placeholder="Mô tả video cần tạo..." class="input"></textarea>
  </div>
  <div id="videoBatch" class="hidden">
    <label class="label">Nhiều prompt (mỗi dòng 1 prompt)</label>
    <textarea id="videoBatchPrompts" rows="5" placeholder="Prompt 1&#10;Prompt 2&#10;Prompt 3..." class="input"></textarea>
  </div>

  <div class="row2">
    <div>
      <label class="label">Ảnh Start</label>
      <div class="upload-box" data-trigger="startImageInput">
        <div id="startImagePreview" class="upload-placeholder">📷 Upload</div>
      </div>
      <input type="file" id="startImageInput" accept="image/*" class="hidden">
    </div>
    <div>
      <label class="label">Ảnh End</label>
      <div class="upload-box" data-trigger="endImageInput">
        <div id="endImagePreview" class="upload-placeholder">📷 Upload</div>
      </div>
      <input type="file" id="endImageInput" accept="image/*" class="hidden">
    </div>
  </div>

  <div class="row2">
    <div>
      <label class="label">Ratio</label>
      <select id="videoRatio" class="select">
        <option value="VIDEO_ASPECT_RATIO_PORTRAIT">9:16 Dọc</option>
        <option value="VIDEO_ASPECT_RATIO_LANDSCAPE">16:9 Ngang</option>
        <option value="VIDEO_ASPECT_RATIO_SQUARE">1:1 Vuông</option>
      </select>
    </div>
    <div>
      <label class="label">Model</label>
      <select id="videoModel" class="select">
        <option value="auto">Tự động</option>
        <option value="veo_3_1_i2v_lite_low_priority">Veo 3.1 i2v Lite</option>
        <option value="veo_3_1_t2v_lite_low_priority">Veo 3.1 t2v Lite</option>
      </select>
    </div>
  </div>

  <button id="btnCreateVideo" class="btn btn-blue">▶ Tạo Video</button>
  <div id="videoStatus" class="status-msg hidden"></div>
</div>

<!-- TAB IMAGE -->
<div id="tab-image" class="tab-content hidden">
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="single" data-group="image">Đơn lẻ</button>
    <button class="mode-btn" data-mode="batch" data-group="image">Batch</button>
  </div>

  <div id="imageSingle">
    <label class="label">Prompt</label>
    <textarea id="imagePrompt" rows="3" placeholder="Mô tả ảnh cần tạo..." class="input"></textarea>
  </div>
  <div id="imageBatch" class="hidden">
    <label class="label">Nhiều prompt (mỗi dòng 1 prompt)</label>
    <textarea id="imageBatchPrompts" rows="5" placeholder="Prompt 1&#10;Prompt 2&#10;Prompt 3..." class="input"></textarea>
  </div>

  <div>
    <label class="label">Ảnh tham chiếu (tùy chọn)</label>
    <div class="upload-box" data-trigger="refImageInput">
      <div id="refImagePreview" class="upload-placeholder">📷 Upload ảnh tham chiếu</div>
    </div>
    <input type="file" id="refImageInput" accept="image/*" class="hidden">
  </div>

  <div>
    <label class="label">Model</label>
    <select id="imageModel" class="select">
      <option value="nano_banana_pro">Imagen Pro</option>
      <option value="nano_banana_2">Imagen 2</option>
      <option value="nano_banana_2_lite">Imagen 2 Lite</option>
    </select>
  </div>

  <button id="btnCreateImage" class="btn btn-purple">🎨 Tạo Ảnh</button>
  <div id="imageStatus" class="status-msg hidden"></div>
</div>

<!-- TAB LIST -->
<div id="tab-list" class="tab-content hidden">
  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">Tất cả</button>
    <button class="filter-btn" data-filter="video">Video</button>
    <button class="filter-btn" data-filter="image">Ảnh</button>
    <button class="filter-btn" data-filter="processing">Đang chạy</button>
    <button class="filter-btn" data-filter="done">Xong</button>
    <button class="filter-btn" data-filter="failed">Lỗi</button>
  </div>
  <div class="list-header">
    <span id="taskCount" class="task-count">0 tasks</span>
    <button id="btnRefresh" class="btn-link">↻ Làm mới</button>
  </div>
  <div id="taskList"></div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
